# Render Blueprint. Point Render at this repo and it reads this file, rather than
# filling the same values into dashboard fields by hand.
#
# If the build fails on the Python version, Render does not offer 3.14 yet: drop
# PYTHON_VERSION to 3.13 and change .python-version to match. psycopg 3 supports both and
# no application code changes.

services:
  - type: web
    name: tickets
    runtime: python
    plan: free
    buildCommand: ./build.sh
    # One sync worker serves one request at a time, so ten buyers wait in a single line
    # and the tenth times out. Threads let the process serve others while one waits on
    # the database, which is most of every request. Threads, not workers: the free
    # instance has 512 MB and each extra worker is a whole Python process.
    startCommand: uv run gunicorn config.wsgi:application --threads 4
    healthCheckPath: /admin/login/
    envVars:
      # Generated by Render. Never in the repo, never seen by anyone.
      - key: SECRET_KEY
        generateValue: true

      - key: DEBUG
        value: "False"

      - key: PYTHON_VERSION
        value: "3.14.0"

      # sync: false means Render prompts for the value instead of storing it here.
      # The Neon connection string contains a password; it must not be committed.
      - key: DATABASE_URL
        sync: false

      # Optional. settings.py reads RENDER_EXTERNAL_HOSTNAME itself, so the
      # onrender.com hostname needs no entry here; only a custom domain does. Also feeds
      # CSRF_TRUSTED_ORIGINS, without which admin login fails on CSRF.
      - key: ALLOWED_HOSTS
        sync: false

      # The exact Cloudflare Pages origin once the frontend exists. Never "*".
      - key: CORS_ALLOWED_ORIGINS
        sync: false
